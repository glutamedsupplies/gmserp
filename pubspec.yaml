name: new_gmserp
description: "GMSERP authentication app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^6.8.0
  crop_your_image: ^2.0.0
  crypto: ^3.0.7
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/gmserp_logo.png
  adaptive_icon_background: "#A2D929"
  adaptive_icon_foreground: assets/branding/gmserp_logo.png
  min_sdk_android: 23
  web:
    generate: true
    image_path: assets/branding/gmserp_logo.png
    background_color: "#A2D929"
    theme_color: "#A2D929"
  windows:
    generate: true
    image_path: assets/branding/gmserp_logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/gmserp_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/gmserp_logo.png
