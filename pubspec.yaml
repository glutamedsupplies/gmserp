name: new_gmserp
description: "GMSERP authentication app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^6.9.0
  firebase_database: ^12.1.3
  crop_your_image: ^2.0.0
  crypto: ^3.0.7
  firebase_auth: ^6.6.0
  firebase_core: ^4.14.0
  firebase_storage: ^13.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  gal: ^2.3.3
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  upgrader: ^13.7.0
  url_launcher: ^6.3.2
  web: ^1.1.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/gmserp_logo.png
  # Android adaptive icons cannot be truly transparent; use logo green
  # so no black frame shows around the circular mark.
  adaptive_icon_background: "#BBF815"
  adaptive_icon_foreground: assets/branding/gmserp_logo_foreground.png
  # Keep the full GMS ring inside launcher masks (circle / squircle).
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
  background_color_ios: "#BBF815"
  min_sdk_android: 23
  web:
    generate: true
    image_path: assets/branding/gmserp_logo.png
    background_color: "#BBF815"
    theme_color: "#BBF815"
  windows:
    generate: true
    image_path: assets/branding/gmserp_logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/gmserp_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/gmserp_logo.png
    - assets/branding/gmserp_logo_foreground.png
    - assets/branding/gmserp_notification_icon.png
