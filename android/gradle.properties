# This PC has ~5GB RAM. The Flutter default (-Xmx8G / 4G metaspace) crashes the Gradle JVM.
# preferIPv4Stack: Windows DNS for dl.google.com can return IPv6-only and fail with "No such host is known".
# --enable-native-access: silences Java 22+ restricted System::load warning from Gradle native-platform.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true --enable-native-access=ALL-UNNAMED
# Use Android Studio bundled JDK (Java 25 on this machine).
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio1\\jbr
org.gradle.workers.max=2
org.gradle.parallel=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
android.useAndroidX=true
# Keep legacy KGP until FlutterFire (firebase_auth/core/storage) stops applying
# kotlin-android in their android/build.gradle. Then set builtInKotlin=true
# and remove org.jetbrains.kotlin.android from settings.gradle.kts.
android.newDsl=false
android.builtInKotlin=false
