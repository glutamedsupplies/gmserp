# This PC has ~5GB RAM. The Flutter default (-Xmx8G / 4G metaspace) crashes the Gradle JVM.
# preferIPv4Stack: Windows DNS for dl.google.com can return IPv6-only and fail with "No such host is known".
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.workers.max=2
org.gradle.parallel=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
